<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 900px; height: 300px; overflow: hidden; background: #0e0c16; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="900" height="300"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = 900;
const H = 300;
const FPS = 25;
const DURATION = 6.0;
const SPRITE_COUNT = 150;

const PALETTE = [
  '#00f0ff', '#e000ff', '#ffc700', '#22ff00', '#ff4d6d',
  '#ff8a1f', '#3d7bff', '#a855f7', '#ff5fa2'
];
const SHAPES = ['circle', 'square', 'triangle', 'diamond'];

function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rng = mulberry32(0xCAFEBABE);
const r = () => rng();

function hexToRgb(hex) {
  const n = parseInt(hex.slice(1), 16);
  return `${(n >> 16) & 255}, ${(n >> 8) & 255}, ${n & 255}`;
}

const SPRITES = Array.from({ length: SPRITE_COUNT }, (_, i) => {
  const color = PALETTE[i % PALETTE.length];
  return {
    id: i,
    x0: r() * W,
    y0: r() * H,
    vx: (r() - 0.5) * 70,
    vy: (r() - 0.5) * 45,
    ampX: 12 + r() * 26,
    ampY: 10 + r() * 20,
    freqX: 1 + Math.floor(r() * 2),
    freqY: 1 + Math.floor(r() * 2),
    phase: r() * Math.PI * 2,
    size: 2.2 + r() * 3.0,
    color,
    rgb: hexToRgb(color),
    shape: SHAPES[i % SHAPES.length],
  };
});

function pill(x, y, w, h, rad, fill, stroke, lw = 1) {
  ctx.save();
  ctx.beginPath();
  ctx.roundRect(x, y, w, h, rad);
  ctx.fillStyle = fill;
  ctx.fill();
  if (stroke) {
    ctx.strokeStyle = stroke;
    ctx.lineWidth = lw;
    ctx.stroke();
  }
  ctx.restore();
}

function drawShape(x, y, size, shape, color) {
  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = color;
  ctx.beginPath();
  if (shape === 'square') {
    ctx.rect(-size, -size, size * 2, size * 2);
  } else if (shape === 'triangle') {
    ctx.moveTo(0, -size * 1.15);
    ctx.lineTo(size, size * 0.85);
    ctx.lineTo(-size, size * 0.85);
    ctx.closePath();
  } else if (shape === 'diamond') {
    ctx.moveTo(0, -size * 1.15);
    ctx.lineTo(size * 0.9, 0);
    ctx.lineTo(0, size * 1.15);
    ctx.lineTo(-size * 0.9, 0);
    ctx.closePath();
  } else {
    ctx.arc(0, 0, size, 0, Math.PI * 2);
  }
  ctx.fill();

  ctx.fillStyle = '#ffffff';
  ctx.globalAlpha = 0.72;
  ctx.beginPath();
  ctx.arc(0, 0, size * 0.42, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function posAt(s, t) {
  const u = (t / DURATION) * Math.PI * 2;
  let x = s.x0 + Math.sin(u * s.freqX + s.phase) * s.ampX + Math.cos(u + s.phase) * 18;
  let y = s.y0 + Math.cos(u * s.freqY + s.phase) * s.ampY + Math.sin(u + s.phase) * 12;
  x = ((x % W) + W) % W;
  y = ((y % H) + H) % H;
  return { x, y };
}

function renderFrame(t) {
  ctx.fillStyle = '#0e0c16';
  ctx.fillRect(0, 0, W, H);

  // Subtle radial nebula glow
  const grad = ctx.createRadialGradient(W * 0.5, H * 0.52, 20, W * 0.5, H * 0.52, 420);
  grad.addColorStop(0, 'rgba(109, 40, 217, 0.16)');
  grad.addColorStop(1, 'rgba(14, 12, 22, 0)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Compute all 150 sprite positions for seamless 6s loop
  const pts = SPRITES.map((s) => ({ s, ...posAt(s, t) }));

  // Ripple pulse at center-right
  const pulseT = (t % 3.0) / 3.0;
  const rx = W * 0.62;
  const ry = H * 0.56;
  const radius = 12 + pulseT * 140;
  const alpha = Math.pow(1 - pulseT, 1.5) * 0.75;
  ctx.save();
  ctx.strokeStyle = `rgba(0, 240, 255, ${alpha})`;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(rx, ry, radius, 0, Math.PI * 2);
  ctx.stroke();
  ctx.strokeStyle = `rgba(212, 175, 55, ${alpha * 0.65})`;
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.arc(rx, ry, radius * 0.7, 0, Math.PI * 2);
  ctx.stroke();
  ctx.restore();

  // Deduplicated constellation lines (capped at 4 per sprite)
  const counts = new Uint8Array(SPRITE_COUNT);
  const maxDistSq = 95 * 95;
  ctx.lineWidth = 0.85;
  for (let i = 0; i < pts.length; i++) {
    if (counts[i] >= 4) continue;
    const p1 = pts[i];
    for (let j = i + 1; j < pts.length; j++) {
      if (counts[i] >= 4 || counts[j] >= 4) continue;
      const p2 = pts[j];
      const dx = p2.x - p1.x;
      const dy = p2.y - p1.y;
      const d2 = dx * dx + dy * dy;
      if (d2 < maxDistSq) {
        counts[i]++;
        counts[j]++;
        const op = 0.36 * (1 - d2 / maxDistSq);
        ctx.strokeStyle = `rgba(${p1.s.rgb}, ${op})`;
        ctx.beginPath();
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.stroke();
      }
    }
  }

  // Short motion trails
  ctx.lineWidth = 1.3;
  for (let i = 0; i < pts.length; i++) {
    const p = pts[i];
    const prev = posAt(p.s, t - 0.12);
    if (Math.hypot(p.x - prev.x, p.y - prev.y) < 80) {
      ctx.strokeStyle = `rgba(${p.s.rgb}, 0.35)`;
      ctx.beginPath();
      ctx.moveTo(prev.x, prev.y);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
    }
  }

  // Draw all 150 sprites
  for (let i = 0; i < pts.length; i++) {
    const p = pts[i];
    drawShape(p.x, p.y, p.s.size, p.s.shape, p.s.color);
  }

  // Header pills
  pill(20, 16, 232, 34, 8, 'rgba(26, 22, 48, 0.9)', '#3e3458', 1.2);
  ctx.fillStyle = '#d4af37';
  ctx.beginPath();
  ctx.arc(36, 33, 4.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#f5e6b4';
  ctx.font = 'bold 11.5px "Segoe UI", DejaVu Sans, sans-serif';
  ctx.textBaseline = 'middle';
  ctx.textAlign = 'left';
  ctx.fillText('150-SPRITE PLAYGROUND  v5.0', 48, 33);

  pill(290, 16, 320, 34, 8, 'rgba(26, 22, 48, 0.86)', 'rgba(212, 175, 55, 0.45)', 1);
  ctx.fillStyle = '#fde047';
  ctx.font = 'bold 11px "Segoe UI", DejaVu Sans, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('▶  CLICK TO LAUNCH 150-SPRITE PLAYGROUND', 450, 33);

  pill(658, 16, 222, 34, 8, 'rgba(26, 22, 48, 0.9)', '#3e3458', 1.2);
  ctx.fillStyle = '#00f0ff';
  ctx.beginPath();
  ctx.arc(674, 33, 4.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#f5e6b4';
  ctx.textAlign = 'left';
  ctx.fillText('BOIDS · RIPPLES · SUPERNOVA', 686, 33);
}

window.__renderFrame = function(t) {
  renderFrame(t);
};

if (!navigator.webdriver) {
  const start = performance.now();
  (function loop(now) {
    renderFrame(((now - start) / 1000) % DURATION);
    requestAnimationFrame(loop);
  })(start);
}
</script>
</body>
</html>
