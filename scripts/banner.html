<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 900px; height: 300px; overflow: hidden; background: #0e0c16; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="900" height="300"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = 900;
const H = 300;
const DURATION = 6.0;
const DU_DT = (Math.PI * 2) / DURATION;
const SPRITE_COUNT = 100;

const PALETTE = [
  '#00f0ff', '#e000ff', '#ffc700', '#22ff00', '#ff4d6d',
  '#ff8a1f', '#3d7bff', '#a855f7', '#ff5fa2'
];
const SHAPES = ['circle', 'square', 'triangle', 'diamond'];

function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rng = mulberry32(0xCAFEBABE);
const r = () => rng();

function hexToRgb(hex) {
  const n = parseInt(hex.slice(1), 16);
  return `${(n >> 16) & 255}, ${(n >> 8) & 255}, ${n & 255}`;
}

const glowCache = new Map();
function getGlowStamp(color, rgb) {
  let stamp = glowCache.get(color);
  if (stamp) return stamp;
  const s = 44;
  const h = s / 2;
  stamp = document.createElement('canvas');
  stamp.width = s;
  stamp.height = s;
  const g = stamp.getContext('2d');
  const grad = g.createRadialGradient(h, h, 0, h, h, h);
  grad.addColorStop(0, `rgba(${rgb}, 0.65)`);
  grad.addColorStop(0.35, `rgba(${rgb}, 0.22)`);
  grad.addColorStop(1, `rgba(${rgb}, 0)`);
  g.fillStyle = grad;
  g.fillRect(0, 0, s, s);
  glowCache.set(color, stamp);
  return stamp;
}

const SPRITES = Array.from({ length: SPRITE_COUNT }, (_, i) => {
  const color = PALETTE[i % PALETTE.length];
  const depth = 0.8 + r() * 0.4;
  return {
    id: i,
    x0: r() * W,
    y0: r() * H,
    ampX: 14 + r() * 28,
    ampY: 10 + r() * 22,
    freqX: 1 + Math.floor(r() * 2),
    freqY: 1 + Math.floor(r() * 2),
    phase: r() * Math.PI * 2,
    depth,
    size: (2.4 + r() * 2.4) * depth,
    color,
    rgb: hexToRgb(color),
    shape: SHAPES[i % SHAPES.length],
  };
});

function pill(x, y, w, h, rad, fill, stroke, lw = 1) {
  ctx.save();
  ctx.beginPath();
  ctx.roundRect(x, y, w, h, rad);
  ctx.fillStyle = fill;
  ctx.fill();
  if (stroke) {
    ctx.strokeStyle = stroke;
    ctx.lineWidth = lw;
    ctx.stroke();
  }
  // Specular top inset edge
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.16)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(x + rad, y + 1);
  ctx.lineTo(x + w - rad, y + 1);
  ctx.stroke();
  ctx.restore();
}

function drawShape(x, y, angle, sprite) {
  const { size, shape, color, rgb } = sprite;
  const stamp = getGlowStamp(color, rgb);
  const haloR = size * 3.1;

  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = 0.52;
  ctx.drawImage(stamp, x - haloR, y - haloR, haloR * 2, haloR * 2);
  ctx.restore();

  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle);
  ctx.fillStyle = color;
  ctx.beginPath();
  if (shape === 'square') {
    ctx.rect(-size * 0.88, -size * 0.88, size * 1.76, size * 1.76);
  } else if (shape === 'triangle') {
    ctx.moveTo(size * 1.15, 0);
    ctx.lineTo(-size * 0.85, size * 0.92);
    ctx.lineTo(-size * 0.85, -size * 0.92);
    ctx.closePath();
  } else if (shape === 'diamond') {
    ctx.moveTo(size * 1.2, 0);
    ctx.lineTo(0, size * 0.85);
    ctx.lineTo(-size * 1.2, 0);
    ctx.lineTo(0, -size * 0.85);
    ctx.closePath();
  } else {
    ctx.arc(0, 0, size, 0, Math.PI * 2);
  }
  ctx.fill();

  ctx.fillStyle = '#ffffff';
  ctx.globalAlpha = 0.78;
  ctx.beginPath();
  ctx.arc(0, 0, size * 0.42, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

const bgCanvas = document.createElement('canvas');
bgCanvas.width = W;
bgCanvas.height = H;
{
  const bgCtx = bgCanvas.getContext('2d');
  bgCtx.fillStyle = '#0e0c16';
  bgCtx.fillRect(0, 0, W, H);

  // Subtle layered radial nebula wash
  const grad1 = bgCtx.createRadialGradient(W * 0.36, H * 0.44, 15, W * 0.36, H * 0.44, 420);
  grad1.addColorStop(0, 'rgba(91, 33, 182, 0.18)');
  grad1.addColorStop(1, 'rgba(14, 12, 22, 0)');
  bgCtx.fillStyle = grad1;
  bgCtx.fillRect(0, 0, W, H);

  const grad2 = bgCtx.createRadialGradient(W * 0.72, H * 0.62, 10, W * 0.72, H * 0.62, 340);
  grad2.addColorStop(0, 'rgba(0, 180, 216, 0.10)');
  grad2.addColorStop(1, 'rgba(14, 12, 22, 0)');
  bgCtx.fillStyle = grad2;
  bgCtx.fillRect(0, 0, W, H);
}

const counts = new Uint8Array(SPRITE_COUNT);
const px = new Float64Array(SPRITE_COUNT);
const py = new Float64Array(SPRITE_COUNT);
const pAngle = new Float64Array(SPRITE_COUNT);
const MAX_EDGES = (SPRITE_COUNT * (SPRITE_COUNT - 1)) >> 1;
const edgeI = new Uint16Array(MAX_EDGES);
const edgeJ = new Uint16Array(MAX_EDGES);
const edgeD2 = new Float64Array(MAX_EDGES);
const edgeOrder = new Uint16Array(MAX_EDGES);
const SHELL_GAPS = [1750, 701, 301, 132, 57, 23, 10, 4, 1];
const _tmpPos = { x: 0, y: 0, angle: 0 };
const _tmpMid = { x: 0, y: 0, angle: 0 };
const _tmpTail = { x: 0, y: 0, angle: 0 };

function posAt(s, t, out = _tmpPos) {
  const u = t * DU_DT;
  const ax = u * s.freqX + s.phase;
  const ay = u * s.freqY + s.phase;
  const ap = u + s.phase;
  const x = s.x0 + Math.sin(ax) * s.ampX + Math.cos(ap) * 18;
  const y = s.y0 + Math.cos(ay) * s.ampY + Math.sin(ap) * 12;
  const dx = DU_DT * (Math.cos(ax) * s.ampX * s.freqX - Math.sin(ap) * 18);
  const dy = DU_DT * (-Math.sin(ay) * s.ampY * s.freqY + Math.cos(ap) * 12);
  out.x = ((x % W) + W) % W;
  out.y = ((y % H) + H) % H;
  out.angle = Math.atan2(dy, dx);
  return out;
}

function renderFrame(t) {
  ctx.drawImage(bgCanvas, 0, 0);

  // Compute all 100 sprite positions and headings for seamless 6s loop
  for (let i = 0; i < SPRITE_COUNT; i++) {
    posAt(SPRITES[i], t, _tmpPos);
    px[i] = _tmpPos.x;
    py[i] = _tmpPos.y;
    pAngle[i] = _tmpPos.angle;
  }

  // Ripple pulse at center-right
  const pulseT = (t % 3.0) / 3.0;
  const rx = W * 0.62;
  const ry = H * 0.56;
  const radius = 12 + pulseT * 140;
  const alpha = Math.pow(1 - pulseT, 1.5) * 0.8;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.strokeStyle = `rgba(0, 240, 255, ${alpha})`;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(rx, ry, radius, 0, Math.PI * 2);
  ctx.stroke();
  ctx.strokeStyle = `rgba(212, 175, 55, ${alpha * 0.68})`;
  ctx.lineWidth = 1.25;
  ctx.beginPath();
  ctx.arc(rx, ry, radius * 0.7, 0, Math.PI * 2);
  ctx.stroke();
  ctx.restore();

  // Distance-ordered nearest-neighbor constellation lines (capped at 4 per sprite)
  counts.fill(0);
  const maxDistSq = 108 * 108;
  let edgeCount = 0;
  for (let i = 0; i < SPRITE_COUNT; i++) {
    const x1 = px[i];
    const y1 = py[i];
    for (let j = i + 1; j < SPRITE_COUNT; j++) {
      const dx = px[j] - x1;
      const dy = py[j] - y1;
      const d2 = dx * dx + dy * dy;
      if (d2 < maxDistSq) {
        edgeI[edgeCount] = i;
        edgeJ[edgeCount] = j;
        edgeD2[edgeCount] = d2;
        edgeOrder[edgeCount] = edgeCount;
        edgeCount++;
      }
    }
  }
  for (let g = 0; g < SHELL_GAPS.length; g++) {
    const gap = SHELL_GAPS[g];
    if (gap >= edgeCount) continue;
    for (let k = gap; k < edgeCount; k++) {
      const key = edgeOrder[k];
      const keyDist = edgeD2[key];
      let m = k;
      while (m >= gap && edgeD2[edgeOrder[m - gap]] > keyDist) {
        edgeOrder[m] = edgeOrder[m - gap];
        m -= gap;
      }
      edgeOrder[m] = key;
    }
  }
  ctx.lineWidth = 0.85;
  for (let k = 0; k < edgeCount; k++) {
    const idx = edgeOrder[k];
    const i = edgeI[idx];
    const j = edgeJ[idx];
    if (counts[i] >= 4 || counts[j] >= 4) continue;
    counts[i]++;
    counts[j]++;
    const op = 0.34 * (1 - edgeD2[idx] / maxDistSq);
    ctx.strokeStyle = `rgba(${SPRITES[i].rgb}, ${op})`;
    ctx.beginPath();
    ctx.moveTo(px[i], py[i]);
    ctx.lineTo(px[j], py[j]);
    ctx.stroke();
  }

  // Tapered multi-segment motion trails
  ctx.lineCap = 'round';
  for (let i = 0; i < SPRITE_COUNT; i++) {
    const s = SPRITES[i];
    const x = px[i];
    const y = py[i];
    posAt(s, t - 0.08, _tmpMid);
    posAt(s, t - 0.16, _tmpTail);
    if (Math.hypot(x - _tmpMid.x, y - _tmpMid.y) < 60 && Math.hypot(_tmpMid.x - _tmpTail.x, _tmpMid.y - _tmpTail.y) < 60) {
      ctx.strokeStyle = `rgba(${s.rgb}, 0.18)`;
      ctx.lineWidth = 0.9;
      ctx.beginPath();
      ctx.moveTo(_tmpTail.x, _tmpTail.y);
      ctx.lineTo(_tmpMid.x, _tmpMid.y);
      ctx.stroke();

      ctx.strokeStyle = `rgba(${s.rgb}, 0.42)`;
      ctx.lineWidth = 1.7;
      ctx.beginPath();
      ctx.moveTo(_tmpMid.x, _tmpMid.y);
      ctx.lineTo(x, y);
      ctx.stroke();
    }
  }

  // Draw all 100 sprites
  for (let i = 0; i < SPRITE_COUNT; i++) {
    drawShape(px[i], py[i], pAngle[i], SPRITES[i]);
  }

  // Header pills
  pill(20, 16, 232, 34, 8, 'rgba(26, 22, 48, 0.92)', '#3e3458', 1.2);
  ctx.fillStyle = '#d4af37';
  ctx.beginPath();
  ctx.arc(36, 33, 4.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#f5e6b4';
  ctx.font = 'bold 11.5px "Segoe UI", DejaVu Sans, sans-serif';
  ctx.textBaseline = 'middle';
  ctx.textAlign = 'left';
  ctx.fillText('100-SPRITE PLAYGROUND  v5.0', 48, 33);

  pill(290, 16, 320, 34, 8, 'rgba(26, 22, 48, 0.88)', 'rgba(212, 175, 55, 0.45)', 1);
  ctx.fillStyle = '#fde047';
  ctx.font = 'bold 11px "Segoe UI", DejaVu Sans, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('▶  CLICK TO LAUNCH 100-SPRITE PLAYGROUND', 450, 33);

  pill(658, 16, 222, 34, 8, 'rgba(26, 22, 48, 0.92)', '#3e3458', 1.2);
  ctx.fillStyle = '#00f0ff';
  ctx.beginPath();
  ctx.arc(674, 33, 4.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#f5e6b4';
  ctx.textAlign = 'left';
  ctx.fillText('BOIDS · RIPPLES · SUPERNOVA', 686, 33);
}

window.__renderFrame = function(t) {
  renderFrame(t);
};

if (!navigator.webdriver) {
  const start = performance.now();
  (function loop(now) {
    renderFrame(((now - start) / 1000) % DURATION);
    requestAnimationFrame(loop);
  })(start);
}
</script>
</body>
</html>
