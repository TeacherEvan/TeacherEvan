<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 900px; height: 300px; overflow: hidden; background: #0a0812; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="900" height="300"></canvas>
<script>
// ── Deterministic, tick-driven Canvas Renderer for PickaBoo Banner ────────
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
const W = 900, H = 300;

// Dark Academia & Arcane Neon Palette
const BG        = '#0a0812';
const SURFACE   = '#17132b';
const BORDER    = '#43386b';
const GOLD      = '#eab308';
const GOLD_BRIGHT = '#fde047';
const CRIMSON   = '#e11d48';
const AMBER     = '#f59e0b';
const INDIGO    = '#7c3aed';
const PARCHMENT = '#fef3c7';
const ROSE      = '#fb7185';
const SAGE      = '#10b981';

const FW_COLORS = [
  '#fde047', '#eab308', '#e11d48', '#fb7185', '#8b5cf6',
  '#38bdf8', '#10b981', '#f97316', '#f43f5e', '#a855f7',
  '#fef08a', '#2dd4bf'
];

// ── Seeded PRNG (mulberry32) ──────────────────────────────────────────────
function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rng = mulberry32(0xCAFEBABE);
const r   = () => rng();

// ── Pre-seed 220 explosion particles ──────────────────────────────────────
const PARTICLES = Array.from({ length: 220 }, (_, idx) => {
  const ringLayer = idx < 40 ? 1.15 : idx < 130 ? 0.85 : 0.5;
  return {
    angle:  r() * Math.PI * 2,
    speed:  (r() * 340 + 95) * ringLayer,
    size:   r() * 7.5 + 3.2,
    color:  FW_COLORS[Math.floor(r() * FW_COLORS.length)],
    trail:  Math.floor(r() * 7) + 5,
    shape:  r() > 0.52 ? 'star' : r() > 0.25 ? 'spark' : 'orb',
    spin:   (r() - 0.5) * 8,
  };
});

// ── Pre-seed ambient floating stardust motes ──────────────────────────────
const MOTES = Array.from({ length: 42 }, () => ({
  x: r() * (W - 60) + 30,
  y: r() * (H - 60) + 30,
  sz: r() * 2.0 + 0.8,
  ph: r() * Math.PI * 2,
  col: r() > 0.4 ? '#eab308' : '#8b5cf6',
}));

// ── Ambient roaming sprites (rich swarm) ──────────────────────────────────
const ROAMERS = [
  { bx: 118, by: 128, ph: 0.0, col: '#6d28d9', sz: 19, rx: 16, ry: 12 },
  { bx: 215, by: 222, ph: 1.1, col: '#0d9488', sz: 16, rx: 14, ry: 10 },
  { bx: 82,  by: 232, ph: 2.4, col: '#db2777', sz: 15, rx: 11, ry: 12 },
  { bx: 775, by: 122, ph: 1.7, col: '#e11d48', sz: 19, rx: 15, ry: 13 },
  { bx: 815, by: 222, ph: 3.2, col: '#d97706', sz: 16, rx: 13, ry: 11 },
  { bx: 690, by: 235, ph: 4.5, col: '#2563eb', sz: 15, rx: 14, ry: 10 },
  { bx: 445, by: 248, ph: 5.4, col: '#10b981', sz: 16, rx: 18, ry: 9  },
  { bx: 335, by: 96,  ph: 3.9, col: '#9333ea', sz: 14, rx: 12, ry: 10 },
];

// ── Timeline (6.00s @ 25fps = 150 frames) ─────────────────────────────────
// 0.00 – 0.55  chase (calm pursuit with cursor comet trail)
// 0.55 – 3.35  4s countdown (colour escalation, radial timer arc, tether, HUD)
// 3.35 – 4.95  FIREWORK explosion (shockwaves + 220 star/spark trails + BANG emblem)
// 4.95 – 6.00  settle + magical respawn swirl → seamless loop
const T_CONTACT = 0.55;
const T_EXPLODE = 3.35;
const T_END     = 6.00;
const FPS       = 25;

let lx = W * 0.28, ly = H * 0.54;

function cursorAt(t) {
  const a = (t / T_END) * 2 * Math.PI;
  return {
    x: W / 2 + 230 * Math.sin(a),
    y: H / 2 +  52 * Math.sin(2 * a) + 12,
  };
}

// ── Drawing Helpers ───────────────────────────────────────────────────────
function pill(x0, y0, x1, y1, r, fill, stroke, sw = 1) {
  ctx.beginPath();
  ctx.roundRect(x0, y0, x1 - x0, y1 - y0, r);
  if (fill)   { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = sw; ctx.stroke(); }
}

function drawStar(x, y, r, col, alpha = 1, rot = 0) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = col;
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const radius = i % 2 === 0 ? r : r * 0.42;
    const ang    = i * Math.PI / 5 - Math.PI / 2 + rot;
    i === 0
      ? ctx.moveTo(x + radius * Math.cos(ang), y + radius * Math.sin(ang))
      : ctx.lineTo(x + radius * Math.cos(ang), y + radius * Math.sin(ang));
  }
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function drawSparkle(x, y, r, col, alpha = 1, rot = 0) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = col;
  ctx.beginPath();
  for (let i = 0; i < 8; i++) {
    const radius = i % 2 === 0 ? r * 1.15 : r * 0.22;
    const ang    = i * Math.PI / 4 + rot;
    i === 0
      ? ctx.moveTo(x + radius * Math.cos(ang), y + radius * Math.sin(ang))
      : ctx.lineTo(x + radius * Math.cos(ang), y + radius * Math.sin(ang));
  }
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

// Properly closed, non-self-intersecting PickaBoo sprite with 3D highlight & waving skirt
function drawGhost(cx, cy, sz, col, mood, t = 0, jitter = 0, prng = null) {
  if (jitter > 0 && prng) {
    cx += (prng() - 0.5) * jitter;
    cy += (prng() - 0.5) * jitter;
  }
  const s = sz;
  if (s < 1.5) return;

  ctx.save();

  // 1. Multi-layered outer aura glow
  for (const [scale, alpha] of [[2.1, 22], [1.6, 42], [1.22, 68]]) {
    const grad = ctx.createRadialGradient(cx, cy, s * 0.1, cx, cy, s * scale);
    grad.addColorStop(0, col + Math.round(alpha).toString(16).padStart(2, '0'));
    grad.addColorStop(1, 'transparent');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(cx, cy, s * scale, 0, Math.PI * 2);
    ctx.fill();
  }

  // 2. Ghost Body (Continuous clockwise path: top dome L->R, right edge down, 3 bottom waves R->L, left edge up)
  const r = s * 0.85;
  const topY = cy - s * 0.20;
  const botY = cy + s * 0.62;
  const tw = (r * 2) / 3;

  const bodyGrad = ctx.createLinearGradient(cx - r, topY - r, cx + r, botY + tw / 2);
  bodyGrad.addColorStop(0, col);
  bodyGrad.addColorStop(1, col);

  ctx.fillStyle = bodyGrad;
  ctx.shadowColor = col;
  ctx.shadowBlur = mood === 'alarm' ? 18 : 10;

  ctx.beginPath();
  // Top dome from left (PI) to right (0)
  ctx.arc(cx, topY, r, Math.PI, 0, false);
  // Right side down to bottom skirt
  ctx.lineTo(cx + r, botY);
  // 3 scalloped tentacles from RIGHT (i=2) to LEFT (i=0)
  for (let i = 2; i >= 0; i--) {
    const waveOffset = Math.sin(t * 7 + i * 1.6) * (s * 0.06);
    const fx = cx - r + i * tw;
    ctx.arc(fx + tw / 2, botY + waveOffset, tw / 2, 0, Math.PI, false);
  }
  ctx.closePath();
  ctx.fill();
  ctx.shadowBlur = 0;

  // Subtle rim outline
  ctx.strokeStyle = 'rgba(254, 243, 199, 0.28)';
  ctx.lineWidth = 1.2;
  ctx.stroke();

  // 3. 3D Specular Highlight on upper-left dome
  ctx.save();
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.38)';
  ctx.lineWidth = Math.max(1.5, s * 0.11);
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.arc(cx, topY, r * 0.72, Math.PI * 1.15, Math.PI * 1.48, false);
  ctx.stroke();
  ctx.restore();

  // 4. Antenna Stalk & Glowing Orb
  const antTopY = topY - r - s * 0.36;
  const antSway = Math.sin(t * 5) * (s * 0.08);
  ctx.strokeStyle = PARCHMENT;
  ctx.lineWidth = Math.max(1.5, s * 0.09);
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(cx, topY - r + 1);
  ctx.quadraticCurveTo(cx + antSway * 0.5, (topY - r + antTopY) / 2, cx + antSway, antTopY);
  ctx.stroke();

  // Antenna Orb Halo + Core
  const orbR = Math.max(2.8, s * 0.20);
  const orbGlow = ctx.createRadialGradient(cx + antSway, antTopY, 0, cx + antSway, antTopY, orbR * 2.4);
  orbGlow.addColorStop(0, 'rgba(253, 224, 71, 0.85)');
  orbGlow.addColorStop(1, 'transparent');
  ctx.fillStyle = orbGlow;
  ctx.beginPath();
  ctx.arc(cx + antSway, antTopY, orbR * 2.4, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = GOLD_BRIGHT;
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.arc(cx + antSway, antTopY, orbR, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();

  // 5. Expressive Face
  const ex = s * 0.36, ey = cy - s * 0.10, er = Math.max(2.6, s * 0.20);
  if (mood === 'alarm') {
    // Wide panic eyes
    for (const sign of [-1, 1]) {
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(cx + sign * ex, ey, er * 1.35, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#0a0812';
      ctx.lineWidth = 1.2;
      ctx.stroke();

      // Dilated trembling pupil
      ctx.fillStyle = '#0a0812';
      ctx.beginPath();
      ctx.arc(cx + sign * ex, ey, er * 0.48, 0, Math.PI * 2);
      ctx.fill();

      // Tiny catchlight
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(cx + sign * ex - 1.2, ey - 1.2, 1.1, 0, Math.PI * 2);
      ctx.fill();

      // Alarmed eyebrows
      ctx.strokeStyle = '#0a0812';
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.moveTo(cx + sign * (ex - er), ey - er * 1.65);
      ctx.lineTo(cx + sign * (ex + er * 0.8), ey - er * 1.25);
      ctx.stroke();
    }
    // O-mouth
    ctx.fillStyle = '#0a0812';
    ctx.beginPath();
    ctx.ellipse(cx, cy + s * 0.24, s * 0.17, s * 0.21, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = CRIMSON;
    ctx.beginPath();
    ctx.ellipse(cx, cy + s * 0.30, s * 0.10, s * 0.09, 0, 0, Math.PI * 2);
    ctx.fill();

    // Sweat drop
    const sx = cx + r * 0.78, sy = topY - r * 0.25;
    ctx.fillStyle = '#38bdf8';
    ctx.beginPath();
    ctx.moveTo(sx, sy - 5);
    ctx.quadraticCurveTo(sx + 4.5, sy + 2, sx, sy + 5);
    ctx.quadraticCurveTo(sx - 4.5, sy + 2, sx, sy - 5);
    ctx.fill();
  } else {
    // Cute glossy eyes + rosy cheeks + happy smile
    for (const sign of [-1, 1]) {
      // Rosy blush
      ctx.fillStyle = 'rgba(251, 113, 133, 0.75)';
      ctx.beginPath();
      ctx.ellipse(cx + sign * (ex + s * 0.08), ey + er * 1.15, er * 0.75, er * 0.45, 0, 0, Math.PI * 2);
      ctx.fill();

      // Dark eye
      ctx.fillStyle = '#0a0812';
      ctx.beginPath();
      ctx.arc(cx + sign * ex, ey, er, 0, Math.PI * 2);
      ctx.fill();

      // Primary & secondary catchlights
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(cx + sign * ex - er * 0.32, ey - er * 0.32, er * 0.40, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(cx + sign * ex + er * 0.28, ey + er * 0.28, er * 0.18, 0, Math.PI * 2);
      ctx.fill();
    }
    // Cute smile arc
    ctx.strokeStyle = '#0a0812';
    ctx.lineWidth = Math.max(1.6, s * 0.09);
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.arc(cx, cy + s * 0.08, s * 0.18, 0.15 * Math.PI, 0.85 * Math.PI, false);
    ctx.stroke();
  }

  ctx.restore();
}

function drawCursor(x, y, t, pulse = 0) {
  ctx.save();
  // Comet trail behind cursor
  for (let i = 7; i >= 1; i--) {
    const prev = cursorAt(t - i * 0.022);
    const frac = 1 - i / 8;
    ctx.fillStyle = pulse > 0.2 ? CRIMSON : GOLD;
    ctx.globalAlpha = frac * 0.35;
    ctx.beginPath();
    ctx.arc(prev.x, prev.y, 4.5 * frac, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  const r = 13 + pulse * 4;
  // Outer glow
  const g = ctx.createRadialGradient(x, y, 2, x, y, r * 1.8);
  g.addColorStop(0, 'rgba(234, 179, 8, 0.35)');
  g.addColorStop(1, 'transparent');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(x, y, r * 1.8, 0, Math.PI * 2);
  ctx.fill();

  ctx.strokeStyle = GOLD_BRIGHT;
  ctx.lineWidth = 1.8;
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.stroke();

  for (const [dx, dy] of [[r + 6, 0], [-(r + 6), 0], [0, r + 6], [0, -(r + 6)]]) {
    ctx.beginPath();
    ctx.moveTo(x + dx * 0.35, y + dy * 0.35);
    ctx.lineTo(x + dx, y + dy);
    ctx.stroke();
  }
  if (pulse > 0.25) {
    ctx.strokeStyle = CRIMSON;
    ctx.lineWidth = 1.3;
    ctx.beginPath();
    ctx.arc(x, y, r * 1.85, 0, Math.PI * 2);
    ctx.stroke();
  }
  ctx.fillStyle = GOLD_BRIGHT;
  ctx.beginPath();
  ctx.arc(x, y, 3, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

// ── Main Frame Renderer ───────────────────────────────────────────────────
function renderFrame(t) {
  const frameRng = mulberry32(Math.round(t * 1000) + 1337);
  const fr = () => frameRng();

  // 1. Deep Dark Academia Background + Vignette
  ctx.fillStyle = BG;
  ctx.fillRect(0, 0, W, H);

  const bgGrad = ctx.createRadialGradient(W * 0.5, H * 0.5, 40, W * 0.5, H * 0.5, W * 0.6);
  bgGrad.addColorStop(0, '#161129');
  bgGrad.addColorStop(1, '#090710');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);

  // Subtle coordinate dot grid
  ctx.fillStyle = '#241d3d';
  for (let gx = 24; gx < W - 20; gx += 32) {
    for (let gy = 24; gy < H - 20; gy += 32) {
      ctx.fillRect(gx, gy, 2, 2);
    }
  }

  // Ambient floating stardust motes
  for (const m of MOTES) {
    const mx = m.x + Math.sin(t * 1.5 + m.ph) * 8;
    const my = m.y + Math.cos(t * 1.8 + m.ph) * 8;
    const ma = 0.25 + 0.35 * (0.5 + 0.5 * Math.sin(t * 3.2 + m.ph));
    ctx.save();
    ctx.globalAlpha = ma;
    ctx.fillStyle = m.col;
    ctx.beginPath();
    ctx.arc(mx, my, m.sz, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // 2. Ornate Double-Border Frame
  pill(8, 8, W - 8, H - 8, 14, null, BORDER, 1.5);
  pill(12, 12, W - 12, H - 12, 11, null, 'rgba(234, 179, 8, 0.22)', 1);

  // Corner gold diamond accents
  for (const [cx_, cy_] of [[18, 18], [W - 18, 18], [18, H - 18], [W - 18, H - 18]]) {
    drawSparkle(cx_, cy_, 4, GOLD, 0.65);
  }

  // 3. Header Badges
  pill(24, 20, 236, 48, 8, 'rgba(23, 19, 43, 0.92)', BORDER, 1.2);
  ctx.fillStyle = SAGE;
  ctx.shadowColor = SAGE;
  ctx.shadowBlur = 8;
  ctx.beginPath(); ctx.arc(38, 34, 4.5, 0, Math.PI * 2); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = PARCHMENT;
  ctx.font = 'bold 11.5px "Segoe UI", DejaVu Sans, sans-serif';
  ctx.textBaseline = 'middle';
  ctx.textAlign = 'left';
  ctx.fillText('PICKABOO ENGINE  v4.1', 50, 34);

  // Center Interactive Callout Pill
  pill(288, 20, 612, 48, 8, 'rgba(23, 19, 43, 0.85)', 'rgba(234, 179, 8, 0.45)', 1);
  ctx.fillStyle = GOLD_BRIGHT;
  ctx.font = 'bold 11px "Segoe UI", DejaVu Sans, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('▶  CLICK BANNER TO PLAY LIVE INTERACTIVE SWARM', 450, 34);

  // Right Theme Badge
  pill(W - 252, 20, W - 24, 48, 8, 'rgba(23, 19, 43, 0.92)', BORDER, 1.2);
  ctx.fillStyle = GOLD;
  ctx.shadowColor = GOLD;
  ctx.shadowBlur = 8;
  ctx.beginPath(); ctx.arc(W - 238, 34, 4.5, 0, Math.PI * 2); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = PARCHMENT;
  ctx.textAlign = 'left';
  ctx.fillText('DARK ACADEMIA  ·  4s LOOP', W - 226, 34);

  // 4. Ambient Roaming Swarm
  for (const s of ROAMERS) {
    const fx = s.bx + Math.cos(t * 2.1 + s.ph) * s.rx;
    const fy = s.by + Math.sin(t * 3.1 + s.ph) * s.ry;
    drawGhost(fx, fy, s.sz, s.col, 'happy', t + s.ph);
  }

  // 5. Cursor Position
  const cur = cursorAt(t);

  // 6. Lead PickaBoo State Machine
  if (t < T_EXPLODE) {
    const inCountdown = t >= T_CONTACT;
    if (inCountdown) {
      const progress = (t - T_CONTACT) / (T_EXPLODE - T_CONTACT);
      const timeLeft = 4.0 * (1 - progress);
      const jitter   = Math.pow(progress, 2) * 13;
      const pulse    = Math.sin(t * (9 + progress * 20)) * 0.5 + 0.5;

      // Color escalation: Indigo -> Amber -> Crimson
      const sc = timeLeft > 2.5 ? INDIGO : timeLeft > 1.2 ? AMBER : CRIMSON;

      // Crackling Magnetic Energy Tether to Cursor
      ctx.save();
      ctx.strokeStyle = sc;
      ctx.lineWidth = 2;
      ctx.globalAlpha = 0.65;
      ctx.setLineDash([5, 5]);
      ctx.beginPath();
      ctx.moveTo(lx, ly);
      ctx.lineTo(cur.x, cur.y);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.restore();

      // Radial Countdown Gauge Ring around Lead Sprite
      ctx.save();
      const ringR = 39 + pulse * 3;
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.14)';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(lx, ly, ringR, 0, Math.PI * 2);
      ctx.stroke();

      ctx.strokeStyle = sc;
      ctx.shadowColor = sc;
      ctx.shadowBlur = 10;
      ctx.lineWidth = 3.2;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.arc(lx, ly, ringR, -Math.PI / 2, -Math.PI / 2 + (1 - progress) * Math.PI * 2, false);
      ctx.stroke();
      ctx.restore();

      // Lead Sprite in Alarm State
      drawGhost(lx, ly, 27 + progress * 3, sc, 'alarm', t, jitter, fr);

      // Countdown HUD Pill
      const hw = 166, hh = 28;
      const hx = Math.max(24, Math.min(W - hw - 24, lx - hw / 2));
      const hy = Math.max(56, ly - 66);
      pill(hx, hy, hx + hw, hy + hh, 8, 'rgba(12, 10, 22, 0.94)', sc, 2);
      ctx.fillStyle = sc;
      ctx.beginPath(); ctx.arc(hx + 14, hy + 14, 5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = PARCHMENT;
      ctx.font = 'bold 12px "Segoe UI", DejaVu Sans, monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(`DETONATE: ${Math.max(0, timeLeft).toFixed(2)}s`, hx + hw / 2 + 6, hy + 14);

      drawCursor(cur.x, cur.y, t, pulse);
    } else {
      // Motion afterimages while chasing
      drawGhost(lx, ly, 27, INDIGO, 'happy', t);
      drawCursor(cur.x, cur.y, t, 0);
    }
  } else {
    // ── FIREWORK DETONATION PHASE ─────────────────────────────────────────
    const expT    = t - T_EXPLODE;
    const expDur  = 1.75;
    const expNorm = Math.min(1, expT / expDur);

    // Subtle golden flash on initial detonation
    if (expNorm < 0.18) {
      ctx.save();
      ctx.fillStyle = `rgba(253, 224, 71, ${(1 - expNorm / 0.18) * 0.22})`;
      ctx.fillRect(0, 0, W, H);
      ctx.restore();
    }

    drawCursor(cur.x, cur.y, t, 0);

    // Additive blending for glowing shockwaves & fireworks
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';

    // 4 Expanding Shockwave Rings
    for (const [maxR, col, lw] of [[380, GOLD, 3.5], [270, CRIMSON, 3.0], [180, INDIGO, 2.5], [110, SAGE, 2.0]]) {
      const ringR = Math.pow(expNorm, 0.78) * maxR;
      const alpha = Math.max(0, 1 - expNorm);
      if (alpha > 0.02) {
        ctx.save();
        ctx.globalAlpha = alpha * 0.85;
        ctx.strokeStyle = col;
        ctx.lineWidth = lw;
        ctx.beginPath();
        ctx.arc(lx, ly, ringR, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }
    }

    // 220 Firework Particles with Silky Glowing Trails
    for (const p of PARTICLES) {
      const dist = p.speed * Math.pow(expNorm, 0.58);
      const grav = expNorm * expNorm * 52;
      const px   = lx + Math.cos(p.angle) * dist;
      const py   = ly + Math.sin(p.angle) * dist + grav;
      const fade = Math.max(0, 1 - Math.pow(expNorm, 0.92));
      if (fade < 0.04) continue;
      const ps = Math.max(1.5, p.size * (1 - expNorm * 0.55));

      // Glowing comet trail
      for (let tr = 1; tr <= p.trail; tr++) {
        const f   = tr / p.trail;
        const td  = dist * (1 - f * 0.36);
        const tpx = lx + Math.cos(p.angle) * td;
        const tpy = ly + Math.sin(p.angle) * td + grav * (1 - f * 0.45);
        const ta  = fade * 0.52 * (1 - f);
        if (ta < 0.03) continue;
        ctx.globalAlpha = ta;
        ctx.fillStyle = p.color;
        const trR = Math.max(0.6, ps * (0.62 - f * 0.52));
        ctx.beginPath();
        ctx.arc(tpx, tpy, trR, 0, Math.PI * 2);
        ctx.fill();
      }

      // Particle Head
      if (p.shape === 'star') {
        drawStar(px, py, ps, p.color, fade, expNorm * p.spin);
      } else if (p.shape === 'spark') {
        drawSparkle(px, py, ps, p.color, fade, expNorm * p.spin);
      } else {
        ctx.globalAlpha = fade;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(px, py, ps * 0.72, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.restore();

    // PICKABOO BANG! Hero Banner Callout (with custom vector starbursts so no font issues ever occur)
    if (expNorm < 0.68) {
      const ba = Math.min(1, (1 - expNorm / 0.68) * 1.25);
      const scale = expNorm < 0.08 ? 0.75 + (expNorm / 0.08) * 0.30 : 1.05 - (expNorm - 0.08) * 0.08;
      ctx.save();
      ctx.translate(lx, ly);
      ctx.scale(scale, scale);
      ctx.globalAlpha = ba;

      ctx.shadowColor = GOLD;
      ctx.shadowBlur = 22;
      pill(-178, -28, 178, 28, 12, 'rgba(14, 11, 26, 0.94)', GOLD_BRIGHT, 2.5);
      ctx.shadowBlur = 0;
      pill(-173, -23, 173, 23, 9, null, 'rgba(225, 29, 72, 0.55)', 1);

      // Left & right vector starburst emblems
      drawStar(-142, 0, 14, CRIMSON, ba, expNorm * 3);
      drawStar(-142, 0, 9, GOLD_BRIGHT, ba, -expNorm * 3);
      drawStar(142, 0, 14, CRIMSON, ba, -expNorm * 3);
      drawStar(142, 0, 9, GOLD_BRIGHT, ba, expNorm * 3);

      ctx.fillStyle = GOLD_BRIGHT;
      ctx.font = '900 24px "Segoe UI", DejaVu Sans, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.shadowColor = GOLD;
      ctx.shadowBlur = 12;
      ctx.fillText('PICKABOO  BANG!', 0, 1);
      ctx.restore();
    }

    // Seamless Respawn Materialization
    const totalAfter = T_END - T_EXPLODE;
    const totalNorm  = expT / totalAfter;
    if (totalNorm > 0.56) {
      const rf = Math.min(1, (totalNorm - 0.56) / 0.44);
      // Magical respawn ring
      if (rf < 0.85) {
        ctx.save();
        ctx.strokeStyle = GOLD_BRIGHT;
        ctx.globalAlpha = (1 - rf) * 0.7;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(lx, ly, 32 * (1 - rf * 0.5), 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }
      drawGhost(lx, ly, 27 * rf, INDIGO, 'happy', t);
    }
  }
}

// ── Expose Deterministic Frame Renderer to Playwright ─────────────────────
window.__renderFrame = function(t) {
  lx = W * 0.28;
  ly = H * 0.54;
  let tick = 0;
  const totalTicks = Math.round(t * FPS);
  while (tick < totalTicks) {
    const tt  = tick / FPS;
    const cur = cursorAt(tt);
    if (tt < T_EXPLODE) {
      lx += (cur.x - lx) * 0.135;
      ly += (cur.y - ly) * 0.135;
    } else if (tt > T_EXPLODE + (T_END - T_EXPLODE) * 0.56) {
      lx += (W * 0.28 - lx) * 0.12;
      ly += (H * 0.54 - ly) * 0.12;
    }
    tick++;
  }
  renderFrame(t);
  return canvas.toDataURL('image/png');
};

// Also animate live if opened directly in a browser
if (!navigator.webdriver) {
  const start = performance.now();
  function loop(now) {
    const elapsed = ((now - start) / 1000) % T_END;
    window.__renderFrame(elapsed);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
}
</script>
