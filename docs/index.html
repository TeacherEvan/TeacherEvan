<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>100-Sprite Interactive Playground v5.0 | TeacherEvan</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

  :root {
    --surface-void:    oklch(0.14 0.020 278);
    --surface-layer-1: oklch(0.18 0.025 278);
    --surface-layer-2: oklch(0.22 0.028 278);
    --surface-pill:    oklch(0.18 0.025 278 / 0.88);
    --border-subtle:   oklch(1 0 0 / 0.11);
    --border-strong:   oklch(0.78 0.14 85 / 0.65);
    --specular-top:    inset 0 1px 0 0 oklch(1 0 0 / 0.14);
    --specular-elev:   inset 0 1px 0 0 oklch(1 0 0 / 0.24);
    --gold:            oklch(0.78 0.14 85);
    --cyan:            oklch(0.86 0.16 205);
    --parchment:       oklch(0.94 0.04 92);
    --text-muted:      oklch(0.69 0.02 278);
  }

  html[data-theme="light"] {
    --surface-void:    oklch(0.96 0.015 285);
    --surface-layer-1: oklch(0.99 0.008 285);
    --surface-layer-2: oklch(0.93 0.020 285);
    --surface-pill:    oklch(0.98 0.010 285 / 0.88);
    --border-subtle:   oklch(0.20 0.03 278 / 0.14);
    --border-strong:   oklch(0.55 0.16 278 / 0.65);
    --gold:            oklch(0.52 0.15 75);
    --cyan:            oklch(0.52 0.14 215);
    --parchment:       oklch(0.20 0.03 278);
    --text-muted:      oklch(0.44 0.03 278);
  }

  html, body {
    background: #0e0c16;
    background: var(--surface-void);
    color: var(--parchment);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    width: 100%;
    height: 100dvh;
    overflow: hidden;
    touch-action: none;
    -webkit-font-smoothing: antialiased;
  }

  canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    cursor: crosshair;
    touch-action: none;
  }

  header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 16px;
    z-index: 100;
    pointer-events: none;
    gap: 10px;
  }

  .pill {
    background: rgba(26, 22, 48, 0.88);
    background: var(--surface-pill);
    border: 1px solid var(--border-subtle);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-radius: 12px;
    padding: 7px 12px;
    display: flex;
    align-items: center;
    gap: 10px;
    pointer-events: auto;
    max-width: 100%;
    box-shadow:
      var(--specular-top),
      0 2px 4px 0 oklch(0 0 0 / 0.4),
      0 10px 24px -4px oklch(0 0 0 / 0.55);
    contain: layout style;
  }

  .dot-live {
    width: 9px;
    height: 9px;
    flex-shrink: 0;
    border-radius: 50%;
    background: var(--gold);
    box-shadow: 0 0 10px oklch(0.78 0.14 85 / 0.85);
    animation: blink 1.8s infinite ease-in-out;
  }
  @keyframes blink {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.42; transform: scale(0.78); }
  }

  h1 {
    font-size: 13.5px;
    font-weight: 700;
    letter-spacing: 0.35px;
    color: var(--parchment);
  }
  .stat {
    font-size: 12.5px;
    color: var(--text-muted);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .stat strong {
    color: var(--gold);
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 13.5px;
    font-variant-numeric: tabular-nums;
  }

  .controls {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    justify-content: flex-end;
  }

  button, .btn-link {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    min-height: 36px;
    padding: 6px 11px;
    border-radius: 8px;
    font-family: inherit;
    font-size: 12px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    line-height: 1.2;
    color: var(--parchment);
    background: linear-gradient(180deg, oklch(0.24 0.03 278) 0%, oklch(0.18 0.025 278) 100%);
    border: 1px solid oklch(1 0 0 / 0.12);
    box-shadow:
      var(--specular-top),
      0 1px 2px 0 oklch(0 0 0 / 0.45),
      0 4px 8px -2px oklch(0 0 0 / 0.28);
    text-decoration: none;
    cursor: pointer;
    touch-action: manipulation;
    white-space: nowrap;
    transition:
      transform 140ms cubic-bezier(0.22, 1, 0.36, 1),
      border-color 140ms cubic-bezier(0.22, 1, 0.36, 1),
      color 140ms cubic-bezier(0.22, 1, 0.36, 1);
  }

  html[data-theme="light"] button,
  html[data-theme="light"] .btn-link {
    background: linear-gradient(180deg, oklch(0.99 0.008 285) 0%, oklch(0.93 0.015 285) 100%);
    border-color: oklch(0.20 0.03 278 / 0.16);
  }

  button::after, .btn-link::after {
    content: "";
    position: absolute;
    inset: -1px;
    border-radius: inherit;
    background: linear-gradient(180deg, oklch(1 0 0 / 0.07) 0%, oklch(1 0 0 / 0) 100%);
    box-shadow:
      var(--specular-elev),
      0 4px 12px -2px oklch(0 0 0 / 0.5),
      0 0 14px -4px oklch(0.78 0.14 85 / 0.35);
    opacity: 0;
    pointer-events: none;
    transition: opacity 140ms cubic-bezier(0.22, 1, 0.36, 1);
  }

  @media (any-pointer: coarse) {
    button, .btn-link {
      min-height: 44px;
      min-width: 44px;
      padding: 8px 10px;
    }
  }

  @media (hover: hover) and (pointer: fine) {
    button:hover:not(:disabled), .btn-link:hover:not(:disabled) {
      border-color: var(--border-strong);
      transform: translate3d(0, -1px, 0) scale(1.01);
      color: #ffffff;
    }
    html[data-theme="light"] button:hover:not(:disabled),
    html[data-theme="light"] .btn-link:hover:not(:disabled) {
      color: oklch(0.15 0.04 278);
    }
    button:hover:not(:disabled)::after, .btn-link:hover:not(:disabled)::after {
      opacity: 1;
    }
  }

  button:active:not(:disabled), .btn-link:active:not(:disabled) {
    transition-duration: 25ms;
    transform: translate3d(0, 1px, 0) scale(0.985);
    box-shadow:
      inset 0 2px 4px 0 oklch(0 0 0 / 0.65),
      0 1px 1px 0 oklch(0 0 0 / 0.35);
  }
  button:active:not(:disabled)::after, .btn-link:active:not(:disabled)::after {
    opacity: 0;
  }

  button:focus-visible, .btn-link:focus-visible {
    outline: 2px solid var(--gold);
    outline-offset: 2px;
  }

  button:disabled {
    opacity: 0.45;
    cursor: not-allowed;
    transform: none !important;
  }

  button.active {
    background: linear-gradient(180deg, oklch(0.30 0.06 85 / 0.5) 0%, oklch(0.22 0.05 85 / 0.45) 100%);
    border-color: var(--border-strong);
    color: var(--gold);
  }

  footer {
    position: fixed;
    bottom: 14px;
    left: 50%;
    transform: translate3d(-50%, 0, 0);
    background: linear-gradient(180deg, oklch(0.20 0.025 278) 0%, oklch(0.16 0.022 278) 100%);
    border: 1px solid var(--border-subtle);
    border-radius: 999px;
    padding: 7px 16px;
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    color: var(--text-muted);
    z-index: 100;
    pointer-events: none;
    white-space: nowrap;
    max-width: calc(100vw - 24px);
    box-shadow:
      var(--specular-top),
      0 2px 4px 0 oklch(0 0 0 / 0.4),
      0 10px 22px -4px oklch(0 0 0 / 0.5);
    contain: layout style;
  }
  footer strong { color: var(--gold); font-weight: 600; }

  @media (max-width: 680px) {
    header {
      flex-direction: column;
      align-items: stretch;
      padding: 10px 12px;
      gap: 8px;
    }
    .pill {
      justify-content: space-between;
      padding: 6px 10px;
    }
    .controls {
      justify-content: space-between;
      gap: 4px;
    }
    button, .btn-link {
      font-size: 11.5px;
      padding: 6px 8px;
    }
    footer {
      font-size: 11px;
      padding: 6px 12px;
      border-radius: 14px;
      white-space: normal;
      text-align: center;
      line-height: 1.35;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      transition-duration: 0.01ms !important;
      animation-duration: 0.01ms !important;
    }
    .dot-live {
      animation: none;
    }
    button:hover, .btn-link:hover, button:active, .btn-link:active {
      transform: none !important;
    }
  }
</style>
</head>
<body>

<header>
  <div class="pill">
    <div class="dot-live" aria-hidden="true"></div>
    <h1>100-Sprite Playground v5.0</h1>
    <span class="stat" aria-label="Active sprites">✨ <strong id="spriteCount">100</strong></span>
  </div>
  <div class="pill controls">
    <button id="btnSound" title="Toggle Synthesized Web Audio (M)" aria-pressed="true">🔊 Sound</button>
    <button id="btnMotion" title="Reduce motion and spark effects" aria-pressed="false">🌀 Motion</button>
    <button id="btnHud" title="Toggle Educator Physics &amp; Telemetry HUD (D)" aria-pressed="false">🎓 HUD</button>
    <a href="https://github.com/TeacherEvan" target="_blank" rel="noopener noreferrer" class="btn-link" title="Visit TeacherEvan on GitHub">← GitHub</a>
  </div>
</header>

<canvas id="spriteCanvas" role="img" aria-label="100 interactive colorful sprites playground. Drag, fling, tap for ripples, hold for a supernova, or press D for the Educator Physics HUD.">
  Your browser does not support the HTML5 canvas element.
</canvas>

<footer><strong>Drag &amp; fling</strong> sprites · <strong>Tap</strong> for ripples · <strong>Hold</strong> for supernova · <strong>D</strong> HUD</footer>

<script defer src="js/sprite-palette.js"></script>
<script defer src="js/sprite-trail.js"></script>
<script defer src="js/sprite-sparks.js"></script>
<script defer src="js/sprite-engine.js"></script>
<script defer src="js/ambient-soundscape.js"></script>
<script>
window.addEventListener('DOMContentLoaded', function () {
  'use strict';

  const ns = window.TeacherEvan || {};
  const spriteCanvas = document.getElementById('spriteCanvas');
  const btnSound = document.getElementById('btnSound');
  const btnMotion = document.getElementById('btnMotion');
  const btnHud = document.getElementById('btnHud');

  const soundscape = new ns.AmbientSoundscape();
  const spritePlayground = new ns.SpritePlayground(spriteCanvas);

  spritePlayground.onInteraction(function (event) {
    soundscape.handleInteraction(event);
  });

  spritePlayground.resume();

  let soundOn = true;
  function syncSoundUI() {
    if (soundOn) soundscape.unlockFromGesture();
    soundscape.setEnabled(soundOn);
    btnSound.textContent = soundOn ? '🔊 Sound' : '🔇 Muted';
    btnSound.setAttribute('aria-pressed', String(soundOn));
  }
  btnSound.addEventListener('click', function () {
    soundOn = !soundOn;
    syncSoundUI();
  });

  const motionQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
  let reduceMotion = motionQuery.matches;
  function syncMotionUI() {
    spritePlayground.setReducedMotion(reduceMotion);
    btnMotion.setAttribute('aria-pressed', String(reduceMotion));
    btnMotion.classList.toggle('active', reduceMotion);
    btnMotion.textContent = reduceMotion ? '🌀 Reduced' : '🌀 Motion';
  }
  btnMotion.addEventListener('click', function () {
    reduceMotion = !reduceMotion;
    syncMotionUI();
  });
  if (typeof motionQuery.addEventListener === 'function') {
    motionQuery.addEventListener('change', function (e) {
      reduceMotion = e.matches;
      syncMotionUI();
    });
  }
  syncMotionUI();

  let hudOn = false;
  function syncHudUI() {
    spritePlayground.setHudEnabled(hudOn);
    if (btnHud) {
      btnHud.setAttribute('aria-pressed', String(hudOn));
      btnHud.classList.toggle('active', hudOn);
    }
  }
  if (btnHud) {
    btnHud.addEventListener('click', function () {
      hudOn = !hudOn;
      syncHudUI();
    });
  }

  window.addEventListener('keydown', function (e) {
    if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
    if (e.key === 'd' || e.key === 'D') {
      hudOn = !hudOn;
      syncHudUI();
    } else if (e.key === 'm' || e.key === 'M') {
      soundOn = !soundOn;
      syncSoundUI();
    } else if (e.key === 't' || e.key === 'T') {
      const rootEl = document.documentElement;
      const nextTheme = rootEl.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
      rootEl.setAttribute('data-theme', nextTheme);
      spritePlayground.rethemeParticles();
    }
  });

  window.addEventListener('pointerdown', function () {
    if (soundOn) soundscape.unlockFromGesture();
  }, { passive: true });

  window.__sprites = {
    version: '5.0',
    snapshot: function () { return spritePlayground.getSnapshot(); },
    step: function (dtSeconds) { return spritePlayground.stepSimulation(dtSeconds); },
    setHud: function (enabled) {
      hudOn = Boolean(enabled);
      syncHudUI();
    }
  };
});
</script>
</body>
</html>
