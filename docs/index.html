<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>150-Sprite Interactive Playground v5.0 | TeacherEvan</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

  :root {
    --bg:        #0e0c16;
    --surface:   #1a1630;
    --border:    #3e3458;
    --gold:      #d4af37;
    --parchment: #f5e6b4;
    --muted:     #8b8070;
  }

  html, body {
    background: var(--bg);
    color: var(--parchment);
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    width: 100%;
    height: 100dvh;
    overflow: hidden;
    touch-action: none;
  }

  canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    cursor: crosshair;
    touch-action: none;
  }

  header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 18px;
    z-index: 100;
    pointer-events: none;
    gap: 12px;
  }

  .pill {
    background: rgba(26, 22, 48, 0.86);
    border: 1px solid var(--border);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-radius: 10px;
    padding: 8px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    pointer-events: auto;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
  }

  .dot-live {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--gold);
    box-shadow: 0 0 10px var(--gold);
    animation: blink 1.5s infinite ease-in-out;
  }
  @keyframes blink {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.3; transform: scale(0.7); }
  }

  h1 { font-size: 14px; font-weight: 700; letter-spacing: 0.5px; color: var(--parchment); }
  .stat { font-size: 13px; color: var(--muted); }
  .stat strong { color: var(--gold); font-family: monospace; font-size: 14px; }

  .controls { display: flex; gap: 6px; flex-wrap: wrap; }
  button, .btn-link {
    background: var(--surface);
    color: var(--parchment);
    border: 1px solid var(--border);
    padding: 6px 11px;
    border-radius: 7px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    transition: background 0.15s, border-color 0.15s, transform 0.1s, color 0.15s;
    font-family: inherit;
  }
  button:hover, .btn-link:hover {
    background: #2a2448;
    border-color: var(--gold);
    transform: translateY(-1px);
    color: #fff;
  }
  button:active, .btn-link:active { transform: translateY(0); }
  button:focus-visible, .btn-link:focus-visible {
    outline: 2px solid var(--gold);
    outline-offset: 2px;
  }
  button.active {
    background: rgba(212, 175, 55, 0.2);
    border-color: var(--gold);
    color: var(--gold);
  }

  footer {
    position: fixed;
    bottom: 14px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(26, 22, 48, 0.84);
    border: 1px solid var(--border);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-radius: 20px;
    padding: 6px 16px;
    font-size: 12px;
    color: var(--muted);
    z-index: 100;
    pointer-events: none;
    white-space: nowrap;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
  }
  footer strong { color: var(--gold); }

  @media (max-width: 680px) {
    header { flex-direction: column; align-items: stretch; }
    .pill { justify-content: space-between; }
    footer { font-size: 11px; padding: 5px 12px; width: 90%; text-align: center; white-space: normal; }
  }

  @media (prefers-reduced-motion: reduce) {
    .dot-live { animation: none; }
  }
</style>
</head>
<body>

<header>
  <div class="pill">
    <div class="dot-live" aria-hidden="true"></div>
    <h1>150-Sprite Playground v5.0</h1>
    <span class="stat" aria-label="Active sprites">✨ <strong id="spriteCount">150</strong></span>
  </div>
  <div class="pill controls">
    <button id="btnSound" title="Toggle Synthesized Web Audio" aria-pressed="true">🔊 Sound</button>
    <button id="btnMotion" title="Reduce motion and spark effects" aria-pressed="false">🌀 Motion</button>
    <a href="https://github.com/TeacherEvan" target="_blank" rel="noopener" class="btn-link" title="Visit TeacherEvan on GitHub">← GitHub Profile</a>
  </div>
</header>

<canvas id="spriteCanvas" role="img" aria-label="150 interactive colorful sprites playground. Drag, fling, tap for ripples, or hold for a supernova.">
  Your browser does not support the HTML5 canvas element.
</canvas>

<footer><strong>Drag &amp; fling</strong> sprites · <strong>Tap</strong> for ripples · <strong>Hold</strong> for singularity &amp; supernova</footer>

<script defer src="js/sprite-palette.js"></script>
<script defer src="js/sprite-trail.js"></script>
<script defer src="js/sprite-sparks.js"></script>
<script defer src="js/sprite-engine.js"></script>
<script defer src="js/ambient-soundscape.js"></script>
<script>
window.addEventListener('DOMContentLoaded', function () {
  'use strict';

  const ns = window.TeacherEvan || {};
  const spriteCanvas = document.getElementById('spriteCanvas');
  const btnSound = document.getElementById('btnSound');
  const btnMotion = document.getElementById('btnMotion');

  const soundscape = new ns.AmbientSoundscape();
  const spritePlayground = new ns.SpritePlayground(spriteCanvas);

  spritePlayground.onInteraction(function (event) {
    soundscape.handleInteraction(event);
  });

  // Start the 150-sprite playground immediately on load
  spritePlayground.resume();

  let soundOn = true;
  btnSound.addEventListener('click', function () {
    soundOn = !soundOn;
    if (soundOn) soundscape.unlockFromGesture();
    soundscape.setEnabled(soundOn);
    btnSound.textContent = soundOn ? '🔊 Sound' : '🔇 Muted';
    btnSound.setAttribute('aria-pressed', String(soundOn));
  });

  const motionQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
  let reduceMotion = motionQuery.matches;
  function syncMotionUI() {
    spritePlayground.setReducedMotion(reduceMotion);
    btnMotion.setAttribute('aria-pressed', String(reduceMotion));
    btnMotion.classList.toggle('active', reduceMotion);
    btnMotion.textContent = reduceMotion ? '🌀 Motion: Reduced' : '🌀 Motion';
  }
  btnMotion.addEventListener('click', function () {
    reduceMotion = !reduceMotion;
    syncMotionUI();
  });
  if (typeof motionQuery.addEventListener === 'function') {
    motionQuery.addEventListener('change', function (e) {
      reduceMotion = e.matches;
      syncMotionUI();
    });
  }
  syncMotionUI();

  window.addEventListener('pointerdown', function () {
    if (soundOn) soundscape.unlockFromGesture();
  }, { passive: true });

  window.__sprites = {
    version: '5.0',
    snapshot: function () { return spritePlayground.getSnapshot(); }
  };
});
</script>
</body>
</html>
