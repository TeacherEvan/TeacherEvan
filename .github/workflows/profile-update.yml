name: PickaBoo CI & Asset Pipeline

on:
  push:
    paths:
      - 'scripts/**'
      - 'docs/**'
      - 'assets/**'
      - '.github/workflows/**'
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify Web Companion & Assets
        run: |
          echo "Checking assets..."
          test -f assets/pickaboo-banner.svg || exit 1
          test -f assets/pickaboo-loop.gif || exit 1
          test -f docs/index.html || exit 1
          echo "✓ All core assets verified."

      - name: Set up Python
        if: github.event_name == 'workflow_dispatch'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Regenerate banner on manual dispatch
        if: github.event_name == 'workflow_dispatch'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          pip install -q Pillow
          python scripts/generate_pickaboo_loop.py

      - name: Commit asset updates if changed
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/ docs/index.html public/index.html
          git diff --staged --quiet || git commit -m "chore: refresh pickaboo assets [skip ci]"
          git push || true
