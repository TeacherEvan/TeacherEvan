name: PickaBoo CI & Asset Pipeline

on:
  push:
    paths:
      - 'scripts/**'
      - 'docs/**'
      - 'assets/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'README.md'
      - '.github/workflows/**'
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Chromium for the engine test suite
        run: npx playwright install --with-deps chromium

      - name: Verify Web Companion & Assets
        run: |
          echo "Checking assets..."
          test -f assets/pickaboo-banner.svg || exit 1
          test -f assets/pickaboo-loop.gif || exit 1
          test -f docs/index.html || exit 1
          echo "✓ All core assets verified."

      - name: Run test suite
        run: npm test

      - name: Regenerate banner on manual dispatch
        if: github.event_name == 'workflow_dispatch'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          npm run build:gif

      - name: Commit asset updates if changed
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/ docs/index.html
          git diff --staged --quiet || git commit -m "chore: refresh pickaboo assets [skip ci]"
          git push || true
