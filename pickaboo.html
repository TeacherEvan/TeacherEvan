<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PickaBoo — Interactive Sprite Layer</title>
<style>
  :root { --bg: #0b0c15; --accent: #ff4b7a; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: var(--bg); overflow: hidden; }
  body { font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; color: #e6e6f0; }
  #canvasWrap { position: fixed; inset: 0; z-index: 1; cursor: crosshair; }
  canvas { display: block; width: 100%; height: 100%; }
  #overlay { position: fixed; inset: 0; z-index: 2; pointer-events: none; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  #overlay h1 { font: 700 3rem/1 ui-sans-serif, system-ui; letter-spacing: .04em; color: #fff; text-shadow: 0 6px 30px rgba(255,75,122,.6); }
  #overlay p { margin-top: .5rem; opacity: .75; font-size: 1rem; }
  #legend { position: fixed; bottom: 16px; left: 16px; z-index: 3; background: rgba(11,12,21,.8); border: 1px solid rgba(255,75,122,.25); border-radius: 10px; padding: 10px 14px; backdrop-filter: blur(8px); pointer-events: none; }
  #legend h3 { font-size: .8rem; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); margin-bottom: 6px; }
  #legend ul { list-style: none; font-size: .8rem; line-height: 1.35; }
  #legend li::before { content: "•"; color: var(--accent); margin-right: 6px; }
</style>
</head>
<body>
<div id="canvasWrap"><canvas id="c"></canvas></div>
<div id="overlay">
  <h1>PickaBoo</h1>
  <p>Move cursor over sprites → 4-second timer → colorful explosion</p>
</div>
<div id="legend">
  <h3>PickaBoo</h3>
  <ul>
    <li>Sprites follow the cursor</li>
    <li>Contact starts 4s self-destruct timer</li>
    <li>Explosion: colorful animated burst</li>
    <li>Sprite self-destructs on timer end</li>
  </ul>
</div>
<script>
/* PickaBoo — interactive canvas widget (separate from static README.md) */
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W = 0, H = 0;
function resize(){ W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
window.addEventListener('resize', resize); resize();

/* Cursor */
let cx = W/2, cy = H/2;
window.addEventListener('mousemove', e => { cx = e.clientX; cy = e.clientY; }, { passive: true });
window.addEventListener('touchmove', e => { if (e.touches.length) { cx = e.touches[0].clientX; cy = e.touches[0].clientY; } }, { passive: true });

/* Sprite type: cursor-follow, 4-sec timer on contact, colorful explosion, self-destruct */
const COLORS = [
  '#ff4b7a', '#ff7a4b', '#ffd14b', '#4bff9a', '#4ba8ff', '#a84bff', '#ff4bec', '#ffe44b',
];

class Sprite {
  constructor(x, y) {
    this.x = x; this.y = y;
    this.vx = (Math.random() - .5) * .6;
    this.vy = (Math.random() - .5) * .6;
    this.r = 8 + Math.random() * 10;
    this.color = COLORS[Math.floor(Math.random() * COLORS.length)];
    this.alive = true;
    this.timer = null; // 4-second timer starts on cursor contact
    this.timerStarted = 0; // timestamp
  }
  tick() {
    if (!this.alive) return;
    // Follow cursor with gentle lag
    const dx = cx - this.x, dy = cy - this.y;
    const d = Math.hypot(dx, dy);

    // If close to cursor, begin 4-second self-destruct timer
    if (d < this.r * 2.5) {
      if (!this.timerStarted) {
        this.timerStarted = performance.now();
      }
      // Visual warning: glow grows as timer advances
      const elapsed = performance.now() - this.timerStarted;
      if (elapsed >= 4000) {
        this.alive = false; // self-destruct: trigger explosion
      }
    } else {
      // Cursor moved away: reset timer (only on sustained separation)
      if (this.timerStarted && d > this.r * 6) {
        this.timerStarted = 0;
      }
    }

    // Gentle movement (not rigid follow — feels alive)
    this.vx += (dx * 0.003 - this.vx) * 0.03;
    this.vy += (dy * 0.003 - this.vy) * 0.03;
    this.vx = Math.max(-2, Math.min(2, this.vx));
    this.vy = Math.max(-2, Math.min(2, this.vy));
    this.x += this.vx + (Math.random() - .5) * .4;
    this.y += this.vy + (Math.random() - .5) * .4;
    this.x = Math.max(this.r, Math.min(W - this.r, this.x));
    this.y = Math.max(this.r, Math.min(H - this.r, this.y));
  }
  draw() {
    if (!this.alive) return; // sprite destroyed — explosion handled separately
    ctx.save();
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
    ctx.fillStyle = this.color;
    ctx.shadowColor = this.color;
    ctx.shadowBlur = this.timerStarted ? Math.min(25, (performance.now() - this.timerStarted) / 100) : 10;
    ctx.fill();
    ctx.restore();
  }
  explode() { return { x: this.x, y: this.y, color: this.color, life: 1.0 }; }
}

class Particle {
  constructor(x, y, color) {
    this.x = x; this.y = y;
    const angle = Math.random() * Math.PI * 2;
    const speed = 2 + Math.random() * 4;
    this.vx = Math.cos(angle) * speed; this.vy = Math.sin(angle) * speed;
    this.color = color; this.life = 1.0; this.decay = 0.02 + Math.random() * 0.04;
  }
  tick() { this.x += this.vx; this.y += this.vy; this.life -= this.decay; this.vx *= 0.98; this.vy *= 0.98; this.vy += 0.05; }
  draw() {
    ctx.save();
    ctx.globalAlpha = Math.max(0, this.life);
    ctx.fillStyle = this.color;
    ctx.beginPath();
    ctx.arc(this.x, this.y, 3 * this.life, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

const sprites = [];
for (let i = 0; i < 16; i++) sprites.push(new Sprite(W / 2, H / 2));

const explosions = []; // array of arrays (groups) of particles
let animFrame = null;

function render() {
  ctx.fillStyle = 'rgba(11, 12, 21, .35)';
  ctx.fillRect(0, 0, W, H);

  // Update sprites
  for (const s of sprites) { s.tick(); s.draw(); }

  // Handle explosions: when a sprite's timer hits 4000ms, mark dead; render explosion once
  for (const s of sprites) {
    if (!s.alive && !s.exploded) {
      s.exploded = true;
      // Colorful animated bang: 14 particles in bright color + complementary colors
      const c = s.color;
      const colors = [c, '#ffffff', '#ffeb3b', '#4caf50', '#2196f3'];
      const group = [];
      for (let i = 0; i < 14; i++) group.push(new Particle(s.x, s.y, colors[i % colors.length]));
      explosions.push(group);
    }
  }

  // Remove dead sprites after a brief delay so the explosion plays
  for (let i = sprites.length - 1; i >= 0; i--) {
    if (!sprites[i].alive && sprites[i].exploded) {
      // After 20 frames, fully remove (explosion plays independently)
      if (performance.now() - (sprites[i].timerStarted || 0) > 500) sprites.splice(i, 1);
    }
  }

  // Draw explosions; purge finished groups
  for (let i = explosions.length - 1; i >= 0; i--) {
    const group = explosions[i];
    let alive = false;
    for (const p of group) { p.tick(); p.draw(); if (p.life > 0) alive = true; }
    if (!alive) explosions.splice(i, 1);
  }

  // Spawn replacement sprites so the scene stays populated (optional)
  if (sprites.length < 8 && Math.random() < .01) {
    sprites.push(new Sprite(Math.random() * W, Math.random() * H));
  }

  requestAnimationFrame(render);
}

render();
</script>
</body>
</html>
