<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PickaBoo — Cursor Swarm & 4s Self-Destruct | TeacherEvan</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

  :root {
    --bg:       #0e0c16;
    --surface:  #1a1630;
    --border:   #3e3458;
    --gold:     #d4af37;
    --crimson:  #b91c1c;
    --indigo:   #6d28d9;
    --parchment:#f5e6b4;
    --muted:    #8b8070;
  }

  body {
    background: var(--bg);
    color: var(--parchment);
    font-family: 'Segoe UI', system-ui, sans-serif;
    height: 100dvh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  canvas { position: fixed; inset: 0; width: 100%; height: 100%; cursor: crosshair; }

  /* ── HUD ────────────────────────────────────────────────────────────── */
  header {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 20px;
    z-index: 100; pointer-events: none;
  }

  .pill {
    background: rgba(26,22,48,.82);
    border: 1px solid var(--border);
    backdrop-filter: blur(10px);
    border-radius: 10px;
    padding: 8px 16px;
    display: flex; align-items: center; gap: 10px;
    pointer-events: auto;
    box-shadow: 0 4px 20px rgba(0,0,0,.5);
  }

  .dot-live { width:9px; height:9px; border-radius:50%; background:var(--gold);
    box-shadow: 0 0 8px var(--gold); animation: blink 1.6s infinite; }
  @keyframes blink { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.3;transform:scale(.7)} }

  h1 { font-size: 15px; font-weight: 700; letter-spacing:.5px; color: var(--parchment); }
  .stat { font-size: 13px; color: var(--muted); }
  .stat strong { color: var(--crimson); }

  .controls { display: flex; gap: 8px; }
  button {
    background: var(--surface);
    color: var(--parchment);
    border: 1px solid var(--border);
    padding: 7px 13px; border-radius: 7px;
    font-size: 12px; font-weight: 600; cursor: pointer;
    transition: background .15s, border-color .15s, transform .1s;
  }
  button:hover { background: #2a2448; border-color: var(--gold); transform: translateY(-1px); }
  button:active { transform: translateY(0); }

  /* ── Footer tip ──────────────────────────────────────────────────────── */
  footer {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    background: rgba(26,22,48,.80);
    border: 1px solid var(--border);
    backdrop-filter: blur(8px);
    border-radius: 20px;
    padding: 7px 18px;
    font-size: 12px;
    color: var(--muted);
    z-index: 100;
    pointer-events: none;
    white-space: nowrap;
  }
  footer strong { color: var(--gold); }
</style>
</head>
<body>

<header>
  <div class="pill">
    <div class="dot-live"></div>
    <h1>PickaBoo Engine v3</h1>
    <span class="stat">💥 Exploded: <strong id="cnt">0</strong></span>
  </div>
  <div class="pill controls">
    <button id="btnSpawn">＋ Spawn</button>
    <button id="btnSound">🔊 Sound</button>
    <a href="../README.md" style="text-decoration:none"><button>← Profile</button></a>
  </div>
</header>

<canvas id="c"></canvas>

<footer><strong>Move your cursor</strong> near a PickaBoo to start the <strong>4-second self-destruct</strong> countdown!</footer>

<script>
// ── Canvas setup ─────────────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const ctx    = canvas.getContext('2d');
let W, H;
function resize(){ W = canvas.width = innerWidth; H = canvas.height = innerHeight; }
window.addEventListener('resize', resize); resize();

// ── Audio ─────────────────────────────────────────────────────────────────────
let actx = null, soundOn = true;
function initAudio(){ if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); }
document.addEventListener('pointerdown', initAudio, { once: true });

function beep(freq = 520, dur = 0.1, vol = 0.08) {
  if (!soundOn || !actx) return;
  try {
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + dur);
  } catch(_){}
}

function boom() {
  if (!soundOn || !actx) return;
  try {
    const len = actx.sampleRate * 0.45, buf = actx.createBuffer(1, len, actx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i=0;i<len;i++) d[i] = (Math.random()*2-1)*Math.exp(-i/(actx.sampleRate*0.07));
    const src = actx.createBufferSource(), flt = actx.createBiquadFilter(), g = actx.createGain();
    flt.type = 'lowpass'; flt.frequency.setValueAtTime(350, actx.currentTime);
    flt.frequency.linearRampToValueAtTime(40, actx.currentTime+0.4);
    g.gain.setValueAtTime(0.35, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime+0.45);
    src.buffer = buf; src.connect(flt); flt.connect(g); g.connect(actx.destination); src.start();
  } catch(_){}
}

document.getElementById('btnSound').addEventListener('click', () => {
  initAudio(); soundOn = !soundOn;
  document.getElementById('btnSound').textContent = soundOn ? '🔊 Sound' : '🔇 Muted';
});

// ── Pointer ───────────────────────────────────────────────────────────────────
const ptr = { x: -999, y: -999, active: false };
window.addEventListener('pointermove', e => { ptr.x=e.clientX; ptr.y=e.clientY; ptr.active=true; initAudio(); });

// ── Palette ───────────────────────────────────────────────────────────────────
const COLORS = ['#6d28d9','#b91c1c','#d4af37','#c27a30','#2d6a4f','#7b3f6e','#1e6b8c','#7c3d12'];
const FW = ['#d4af37','#b91c1c','#6d28d9','#2d6a4f','#c27a30','#3b82f6','#ec4899','#f5e6b4','#7c3d12','#14b8a6'];

// ── State ─────────────────────────────────────────────────────────────────────
const sprites  = [];
const particles = [];
const waves    = [];
const texts    = [];
let   totalBoom = 0;

// ── Sprite ────────────────────────────────────────────────────────────────────
class PickaBoo {
  constructor(x, y) {
    this.x  = x ?? Math.random()*W;
    this.y  = y ?? Math.random()*H;
    this.vx = (Math.random()-.5)*1.5;
    this.vy = (Math.random()-.5)*1.5;
    this.size   = 22 + Math.random()*6;
    this.color  = COLORS[Math.floor(Math.random()*COLORS.length)];
    this.phase  = Math.random()*Math.PI*2;
    this.state  = 'idle';   // idle | countdown | dead
    this.timer  = 4.0;
    this.prevBeepSec = 5;
    this.jitter = 0;
  }

  update(dt) {
    this.phase += dt*3.8;

    if (this.state === 'idle') {
      if (ptr.active) {
        const dx = ptr.x - this.x, dy = ptr.y - this.y;
        const dist = Math.hypot(dx, dy);
        if (dist < 380 && dist > 1) {
          const f = ((380-dist)/380)*3.2;
          this.vx += dx/dist*f*dt*60;
          this.vy += dy/dist*f*dt*60;
        }
        if (dist < 44) { this.state = 'countdown'; this.timer = 4.0; this.prevBeepSec = 5; beep(440,.12); }
      }
      this.vx *= 0.93; this.vy *= 0.93;
      this.x  += this.vx + Math.cos(this.phase)*.3;
      this.y  += this.vy + Math.sin(this.phase)*.3;
      if (this.x < this.size) { this.x = this.size; this.vx *= -.8; }
      if (this.x > W-this.size) { this.x = W-this.size; this.vx *= -.8; }
      if (this.y < this.size) { this.y = this.size; this.vy *= -.8; }
      if (this.y > H-this.size) { this.y = H-this.size; this.vy *= -.8; }

    } else if (this.state === 'countdown') {
      this.timer -= dt;
      const sec = Math.ceil(this.timer);
      if (sec !== this.prevBeepSec && sec >= 1) {
        this.prevBeepSec = sec;
        beep(380 + (4-sec)*220, .09);
      }
      this.jitter = Math.pow((4-this.timer)/4, 2)*13;
      if (this.timer <= 0) this.explode();
    }
  }

  explode() {
    this.state = 'dead'; totalBoom++;
    document.getElementById('cnt').textContent = totalBoom;
    boom();

    // Shockwaves
    waves.push({ x:this.x, y:this.y, r:8, maxR:280, col:'#d4af37', a:1 });
    waves.push({ x:this.x, y:this.y, r:4, maxR:180, col:'#b91c1c', a:1 });
    waves.push({ x:this.x, y:this.y, r:2, maxR:110, col:'#6d28d9', a:1 });

    // Firework particles with trails
    for (let i=0;i<110;i++) {
      const angle = Math.random()*Math.PI*2;
      const spd   = Math.random()*10+3;
      particles.push({
        x: this.x, y: this.y,
        vx: Math.cos(angle)*spd, vy: Math.sin(angle)*spd,
        size: Math.random()*7+3,
        col: FW[Math.floor(Math.random()*FW.length)],
        life: 1.0, decay: .012+Math.random()*.014,
        trail: [], maxTrail: 6+Math.floor(Math.random()*6),
        isStar: Math.random()>.55
      });
    }

    // Floating text
    texts.push({ x:this.x, y:this.y-20, text:'💥 BOOM!', a:1, col:'#d4af37', vy:-38 });

    // Respawn after 2.4s
    setTimeout(() => {
      this.x = Math.random()*(W-120)+60;
      this.y = Math.random()*(H-120)+60;
      this.vx = (Math.random()-.5)*1.5; this.vy = (Math.random()-.5)*1.5;
      this.color = COLORS[Math.floor(Math.random()*COLORS.length)];
      this.state = 'idle'; this.jitter = 0;
    }, 2400);
  }

  draw() {
    if (this.state === 'dead') return;
    const cx = this.x + (this.state==='countdown' ? (Math.random()-.5)*this.jitter : 0);
    const cy = this.y + (this.state==='countdown' ? (Math.random()-.5)*this.jitter : 0);
    const s  = this.size;
    const col = this.state === 'countdown'
      ? (this.timer > 2.6 ? '#6d28d9' : this.timer > 1.2 ? '#c27a30' : '#b91c1c')
      : this.color;

    ctx.save();

    // Glow
    ctx.shadowColor = col;
    ctx.shadowBlur  = this.state === 'countdown' ? 28 : 14;

    // Dashed leash to cursor during countdown
    if (this.state==='countdown' && ptr.active) {
      ctx.setLineDash([5,5]);
      ctx.strokeStyle = col; ctx.lineWidth = 1.5; ctx.globalAlpha = .5;
      ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(ptr.x, ptr.y); ctx.stroke();
      ctx.setLineDash([]); ctx.globalAlpha = 1;
    }

    // Body
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.arc(cx, cy-s*.2, s*.82, Math.PI, 0, false);
    ctx.lineTo(cx+s*.82, cy+s*.6);
    const tw = (s*1.64)/3;
    for (let i=0;i<3;i++) {
      const fx = cx-s*.82+i*tw;
      ctx.arc(fx+tw/2, cy+s*.6, tw/2, 0, Math.PI, false);
    }
    ctx.closePath(); ctx.fill();

    // Antenna
    ctx.shadowBlur = 0;
    ctx.strokeStyle = '#f5e6b4'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(cx, cy-s); ctx.lineTo(cx, cy-s-9); ctx.stroke();
    ctx.fillStyle = '#d4af37';
    ctx.beginPath(); ctx.arc(cx, cy-s-12, 4.5, 0, Math.PI*2); ctx.fill();

    // Eyes
    const ex = s*.38, ey = cy-s*.12, er = Math.max(2.5, s*.20);
    if (this.state==='countdown') {
      ctx.fillStyle = '#f5e6b4';
      [-1,1].forEach(sign => {
        ctx.beginPath(); ctx.arc(cx+sign*ex, ey, er*1.35, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle='#0e0c16';
        ctx.beginPath(); ctx.arc(cx+sign*ex, ey, 2, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle='#f5e6b4';
      });
      ctx.fillStyle='#0e0c16';
      ctx.beginPath(); ctx.arc(cx, cy+s*.22, 4, 0, Math.PI*2); ctx.fill();

      // HUD countdown pill
      const hw=148, hh=26, hx=cx-hw/2, hy=cy-s-50;
      ctx.fillStyle='rgba(14,12,22,.92)';
      ctx.strokeStyle=col; ctx.lineWidth=2;
      ctx.beginPath(); ctx.roundRect(hx,hy,hw,hh,7); ctx.fill(); ctx.stroke();
      ctx.fillStyle='#f5e6b4'; ctx.font='bold 12px sans-serif';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(`💥 DETONATE: ${Math.max(0,this.timer).toFixed(2)}s`, cx, hy+13);

    } else {
      ctx.fillStyle='#0e0c16';
      [-1,1].forEach(sign => {
        ctx.beginPath(); ctx.arc(cx+sign*ex, ey, er, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle='#f5e6b4';
        ctx.beginPath(); ctx.arc(cx+sign*ex-1.5, ey-er+1.5, 1.5, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle='#b03060';
        ctx.beginPath(); ctx.arc(cx+sign*ex, ey+5, 3, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle='#0e0c16';
      });
      ctx.strokeStyle='#0e0c16'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(cx, cy+s*.1, 4, 0, Math.PI, false); ctx.stroke();
    }

    ctx.restore();
  }
}

// Spawn initial 9 sprites
function spawn(n=5) { for(let i=0;i<n;i++) sprites.push(new PickaBoo()); }
spawn(9);
document.getElementById('btnSpawn').addEventListener('click', () => spawn(4));

// ── Star helper ───────────────────────────────────────────────────────────────
function drawStar(x, y, r, col, alpha=1) {
  ctx.save(); ctx.globalAlpha=alpha; ctx.fillStyle=col;
  ctx.beginPath();
  for (let i=0;i<10;i++) {
    const radius = i%2===0 ? r : r*.42;
    const angle  = i*Math.PI/5 - Math.PI/2;
    i===0 ? ctx.moveTo(x+radius*Math.cos(angle), y+radius*Math.sin(angle))
          : ctx.lineTo(x+radius*Math.cos(angle), y+radius*Math.sin(angle));
  }
  ctx.closePath(); ctx.fill(); ctx.restore();
}

// ── Main loop ─────────────────────────────────────────────────────────────────
let last = performance.now();
function frame(now) {
  const dt = Math.min((now-last)/1000, .06); last=now;

  // Background
  ctx.fillStyle = '#0e0c16'; ctx.fillRect(0,0,W,H);
  // dot grid
  ctx.fillStyle = '#1c1830';
  for(let gx=20;gx<W;gx+=36) for(let gy=20;gy<H;gy+=36) ctx.fillRect(gx,gy,2,2);

  // Shockwaves
  for(let i=waves.length-1;i>=0;i--) {
    const w=waves[i];
    w.r += dt*360; w.a = Math.max(0, 1-w.r/w.maxR);
    if (w.a<.02) { waves.splice(i,1); continue; }
    ctx.save(); ctx.globalAlpha=w.a; ctx.strokeStyle=w.col; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(w.x,w.y,w.r,0,Math.PI*2); ctx.stroke(); ctx.restore();
  }

  // Particles + trails
  for(let i=particles.length-1;i>=0;i--) {
    const p=particles[i];
    p.trail.unshift({x:p.x, y:p.y});
    if(p.trail.length > p.maxTrail) p.trail.pop();
    p.x+=p.vx; p.y+=p.vy; p.vy+=.16; p.vx*=.98;
    p.life-=p.decay;
    if(p.life<=0){ particles.splice(i,1); continue; }

    // Draw trail
    p.trail.forEach((pt,ti) => {
      const ta = p.life*(1-ti/p.trail.length)*.5;
      if(ta<.04) return;
      ctx.globalAlpha=ta; ctx.fillStyle=p.col;
      const tr = Math.max(1, p.size*.4*(1-ti/p.trail.length));
      ctx.beginPath(); ctx.arc(pt.x, pt.y, tr, 0, Math.PI*2); ctx.fill();
    });
    ctx.globalAlpha=1;

    // Head
    if (p.isStar) drawStar(p.x, p.y, p.size*p.life, p.col, p.life);
    else {
      ctx.globalAlpha=p.life; ctx.fillStyle=p.col;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.size*p.life*.7,0,Math.PI*2); ctx.fill();
      ctx.globalAlpha=1;
    }
  }

  // Floating texts
  for(let i=texts.length-1;i>=0;i--) {
    const t=texts[i];
    t.y+=t.vy*dt; t.a-=dt*.7;
    if(t.a<=0){ texts.splice(i,1); continue; }
    ctx.save(); ctx.globalAlpha=t.a;
    ctx.font='bold 22px sans-serif'; ctx.fillStyle=t.col;
    ctx.textAlign='center'; ctx.shadowColor=t.col; ctx.shadowBlur=12;
    ctx.fillText(t.text, t.x, t.y);
    ctx.restore();
  }

  // Sprites
  sprites.forEach(s=>{ s.update(dt); s.draw(); });

  // Cursor reticle
  if (ptr.active) {
    ctx.save();
    ctx.strokeStyle='#d4af37'; ctx.lineWidth=1.5;
    const r=14;
    ctx.beginPath(); ctx.arc(ptr.x,ptr.y,r,0,Math.PI*2); ctx.stroke();
    [[r+4,0],[-(r+4),0],[0,r+4],[0,-(r+4)]].forEach(([dx,dy])=>{
      ctx.beginPath(); ctx.moveTo(ptr.x+dx*.3,ptr.y+dy*.3); ctx.lineTo(ptr.x+dx,ptr.y+dy); ctx.stroke();
    });
    ctx.fillStyle='#d4af37'; ctx.beginPath(); ctx.arc(ptr.x,ptr.y,3,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
